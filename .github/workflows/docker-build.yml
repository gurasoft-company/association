name: Build Docker Images (Monorepo)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [backend, frontend-admin, frontend-public]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build ${{ matrix.service }}
      run: |
        docker build -t association-${{ matrix.service }} \
          -f packages/${{ matrix.service }}/Dockerfile \
          packages/${{ matrix.service }}

    - name: Save ${{ matrix.service }} image
      run: |
        docker save association-${{ matrix.service }} > association-${{ matrix.service }}.tar

    - name: Upload ${{ matrix.service }} artifact
      uses: actions/upload-artifact@v4   # ← Changement clé
      with:
        name: association-${{ matrix.service }}
        path: association-${{ matrix.service }}.tar